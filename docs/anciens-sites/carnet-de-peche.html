<style>
:root{
  --sable:#F3F1E7;--sable-fonce:#E4E0D0;--eau:#1C5566;--eau-clair:#4E8296;
  --roseau:#3E6B4A;--bouchon:#C94A34;--craie:#FFFFFF;--nuit:#16323C;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--sable);color:var(--nuit);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.6}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:800;line-height:1.15;margin:0}
h1{font-size:clamp(28px,7vw,40px)}
h2{font-size:clamp(22px,5vw,28px)}
h3{font-size:19px;font-weight:600}
button{font:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 70px}
.entete{position:relative;padding:26px 20px 22px;background:var(--eau);color:var(--craie);overflow:hidden}
.entete-in{max-width:720px;margin:0 auto;position:relative;z-index:2}
.entete p{margin:6px 0 0;opacity:.85;font-size:15px}
.entete h1{color:#FF5A45}
.vagues{position:absolute;left:0;right:0;bottom:-2px;height:26px;opacity:.35}
.onglets{display:flex;gap:6px;max-width:720px;margin:14px auto 18px;padding:0 20px;flex-wrap:wrap}
.onglet{background:transparent;border:1.5px solid var(--eau-clair);color:var(--eau);border-radius:999px;padding:7px 14px;font-size:14.5px}
.onglet[aria-selected="true"]{background:var(--eau);border-color:var(--eau);color:var(--craie);font-weight:700}
.onglet:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bouchon);outline-offset:2px}
.carte{background:var(--craie);border:1.5px solid var(--sable-fonce);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 2px 0 var(--sable-fonce)}
.carte h3{margin-bottom:4px}
.liste-chap{display:grid;gap:12px}
a.chap,button.chap{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--craie);
  border:1.5px solid var(--sable-fonce);border-radius:var(--r);padding:14px 16px;color:inherit;box-shadow:0 2px 0 var(--sable-fonce)}
button.chap:hover{border-color:var(--eau)}
.num{flex:0 0 40px;height:40px;border-radius:50%;background:var(--eau);color:var(--craie);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-family:"Fraunces",serif}
.num.fini{background:var(--roseau)}
.chap small{display:block;color:var(--eau-clair);font-size:14.5px}
.corps p{margin:0 0 14px}
.corps ul{margin:0 0 14px;padding-left:20px}
.corps li{margin:5px 0}
.astuce{background:#EAF2F0;border-left:5px solid var(--roseau);border-radius:8px;padding:12px 14px;margin:0 0 14px}
.astuce b{display:block}
.danger{background:#FBEDE9;border-left:5px solid var(--bouchon);border-radius:8px;padding:12px 14px;margin:0 0 14px}
figure{margin:0 0 16px;background:#F7F9F9;border:1px solid var(--sable-fonce);border-radius:10px;padding:12px}
figure svg{width:100%;height:auto;display:block}
figcaption{font-size:14px;color:var(--eau-clair);margin-top:8px;text-align:center}
.cta{display:block;width:100%;margin-top:8px;background:var(--bouchon);color:var(--craie);border:0;border-radius:10px;padding:14px;font-size:18px;font-weight:700}
.cta.sec{background:var(--craie);color:var(--eau);border:1.5px solid var(--eau)}
.retour{background:none;border:0;color:var(--eau);padding:6px 0;font-size:15px}
.poisson{display:flex;gap:14px;align-items:flex-start}
.poisson svg{flex:0 0 128px;width:128px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{background:var(--sable-fonce);color:var(--nuit);border-radius:999px;padding:4px 12px;font-size:14px}
.badge.ok{background:var(--roseau);color:var(--craie)}
.enonce{font-size:20px;margin:0 0 16px}
.choix{display:flex;flex-direction:column;gap:9px}

const CLE="peche:carnet";
let etat={quiz:{},prises:[],sac:[]};
let modeStockage="aucun";
async function charger(){
  if(typeof window.storage!=="undefined"){
    modeStockage="claude";
    try{const r=await window.storage.get(CLE);if(r&&r.value)Object.assign(etat,JSON.parse(r.value));}catch(e){}
    return;}
  try{const v=window.localStorage.getItem(CLE);modeStockage="local";if(v)Object.assign(etat,JSON.parse(v));}
  catch(e){modeStockage="aucun";}
}
async function sauver(){
  try{
    if(modeStockage==="claude"){await window.storage.set(CLE,JSON.stringify(etat));return;}
    if(modeStockage==="local"){window.localStorage.setItem(CLE,JSON.stringify(etat));return;}
  }catch(e){modeStockage="aucun";}
}

let Q=null;
function lancerQuiz(questions,cle,titre){
  const melangees=questions.map(q=>{
    const choix=[q.b,...q.f];
    for(let i=choix.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choix[i],choix[j]]=[choix[j],choix[i]];}
    return {enonce:q.q,choix,bonne:choix.indexOf(q.b),expl:q.e};
  });
  Q={questions:melangees,i:0,res:[],cle,titre};
  afficherQuestion();montrer("partie");
}
function afficherQuestion(){
  const q=Q.questions[Q.i];
  const barre=Q.questions.map((_,i)=>i<Q.res.length?`<i class="${Q.res[i]?"ok":"ko"}"></i>`:`<i class="${i===Q.i?"en":""}"></i>`).join("");
  $("#vue-partie").innerHTML=`
    <div class="carte">
      <p class="note">${Q.titre} · question ${Q.i+1} sur ${Q.questions.length}</p>
      <div class="barre">${barre}</div>
      <p class="enonce">${q.enonce}</p>
      <div class="choix" id="zone"></div>
      <div id="verdict"></div>
      <button class="cta cache" id="suivant">Question suivante</button>
    </div>`;
  const z=$("#zone");
  q.choix.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>repondre(i);z.appendChild(b);});
}
function repondre(i){
  const q=Q.questions[Q.i],juste=i===q.bonne;
  const btns=[...$("#zone").children];btns.forEach(b=>b.disabled=true);
  btns[q.bonne].classList.add("bon");
  if(!juste)btns[i].classList.add("mauvais");
  Q.res.push(juste);
  $("#verdict").innerHTML=`<div class="verdict ${juste?"ok":"ko"}"><b>${juste?"Bien vu.":"La réponse était : "+q.choix[q.bonne]}</b>${q.expl}</div>`;
  const s=$("#suivant");s.classList.remove("cache");
  s.textContent=Q.i===Q.questions.length-1?"Voir le résultat":"Question suivante";
  s.onclick=()=>{Q.i++;Q.i<Q.questions.length?afficherQuestion():finQuiz();};
  s.focus();
}
async function finQuiz(){
  const score=Q.res.filter(Boolean).length,total=Q.res.length;
  const reussi=score>=Math.ceil(total*0.8);
  if(Q.cle!=="grand"){
    const a=etat.quiz[Q.cle]||{meilleur:0,reussi:false};
    etat.quiz[Q.cle]={meilleur:Math.max(a.meilleur,score),reussi:a.reussi||reussi};
    await sauver();
  }
  const mot=reussi?"Chapitre validé. Tu peux passer au suivant.":"Presque. Relis le chapitre et retente, ça rentrera vite.";
  $("#vue-partie").innerHTML=`
    <div class="carte">
      <h2>${score} sur ${total}</h2>
      <p>${Q.cle==="grand"?(score>=8?"Beau score au grand quiz.":"Pas mal. Retente quand tu veux."):mot}</p>
      <button class="cta" id="rejouer">Refaire ce quiz</button>
      <button class="cta sec" id="fin">Revenir aux chapitres</button>
    </div>`;
  $("#fin").onclick=()=>{vueApprendre();montrer("apprendre");};
  $("#rejouer").onclick=()=>lancerQuiz(Q.cle==="grand"?CHAPITRES.flatMap(c=>c.quiz).slice(0,10):CHAPITRES[Q.cle].quiz,Q.cle,Q.titre);
}
