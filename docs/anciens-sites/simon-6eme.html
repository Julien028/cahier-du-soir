<style>
:root{
  --papier:#F8F7F2;--papier-fonce:#EFEDE4;--seyes:#C3CDE7;--seyes-fort:#9FAFD6;
  --marge:#C1443A;--encre:#1E3A6E;--encre-clair:#5A6E96;--juste:#2C7A52;--craie:#FFFFFF;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papier);color:var(--encre);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:800;line-height:1.1;margin:0}
h1{font-size:clamp(28px,7vw,40px);letter-spacing:-.01em}
h2{font-size:clamp(21px,4.5vw,26px)}
h3{font-size:18px;font-weight:600}
button{font:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 64px}
.entete{position:relative;padding:26px 20px 22px;margin-bottom:8px;background:linear-gradient(var(--seyes) 1px,transparent 1px) 0 0/100% 26px,var(--craie);border-bottom:2px solid var(--seyes-fort)}
.entete::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:2px;background:var(--marge);opacity:.75}
.entete-in{max-width:720px;margin:0 auto;padding-left:30px}
.entete p{margin:6px 0 0;color:var(--encre-clair);font-size:15px}
.entete h1{color:#C62828}
.onglets{display:flex;gap:6px;max-width:720px;margin:14px auto 20px;padding:0 20px;flex-wrap:wrap}
.onglet{background:transparent;border:1.5px solid var(--seyes-fort);color:var(--encre-clair);border-radius:999px;padding:7px 15px;font-size:14.5px}
.onglet[aria-selected="true"]{background:var(--encre);border-color:var(--encre);color:var(--craie);font-weight:700}
.onglet:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--marge);outline-offset:2px}
.carte{background:var(--craie);border:1.5px solid var(--seyes-fort);border-radius:var(--r);padding:20px;box-shadow:0 2px 0 var(--seyes-fort)}
.carte.defi{border-color:var(--marge);box-shadow:0 2px 0 var(--marge)}
.jour-ligne{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;color:var(--encre-clair);font-size:15px}
.pastille{background:var(--encre);color:var(--craie);border-radius:999px;padding:3px 11px;font-size:14px;font-weight:700}
.pastille.rouge{background:var(--marge)}
.notion{margin:14px 0 0;font-size:17.5px}
.rituel{margin:10px 0 0;font-size:15px;color:var(--encre-clair)}
.cta{display:block;width:100%;margin-top:18px;background:var(--marge);color:var(--craie);border:0;border-radius:10px;padding:15px;font-size:18px;font-weight:700}
.cta.sec{background:var(--craie);color:var(--encre);border:1.5px solid var(--encre)}
.frise{margin-top:26px}
.frise-grille{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin-top:10px}
.case{aspect-ratio:1;background:var(--papier-fonce);border-radius:2px}
.case.faite{background:var(--encre)}
.case.partielle{background:var(--seyes-fort)}
.case.aujourdhui{outline:2px solid var(--marge);outline-offset:1px}
.legende{display:flex;gap:16px;margin-top:10px;font-size:13.5px;color:var(--encre-clair);flex-wrap:wrap}
.puce{width:11px;height:11px;border-radius:2px;display:inline-block}
.stats{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap}
.stat b{display:block;font-family:"Fraunces",serif;font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:14px;color:var(--encre-clair)}
.barre{display:flex;gap:4px;margin-bottom:18px}
.barre i{flex:1;height:5px;background:var(--papier-fonce);border-radius:3px}
.barre i.ok{background:var(--juste)}.barre i.ko{background:var(--marge)}.barre i.en{background:var(--encre)}
.enonce{font-size:20px;line-height:1.45;margin:0 0 18px}
.choix{display:flex;flex-direction:column;gap:9px}
.choix button{text-align:left;background:var(--craie);border:1.5px solid var(--seyes-fort);border-radius:10px;padding:13px 15px;color:var(--encre)}
.choix button.sel{border-color:var(--encre);border-width:2.5px}
.choix button.bon{border-color:var(--juste);background:#EEF6F0}
.choix button.mauvais{border-color:var(--marge);background:#FBEFEE}
input[type=text]{width:100%;padding:14px;font-size:19px;border:1.5px solid var(--seyes-fort);border-radius:10px;background:var(--craie);color:var(--encre)}
.verdict{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:5px solid}
.verdict.ok{background:#EEF6F0;border-color:var(--juste)}
.verdict.ko{background:#FBEFEE;border-color:var(--marge)}
.verdict b{display:block;margin-bottom:4px}
.chrono{font-size:14px;color:var(--encre-clair);text-align:right;margin-bottom:6px}
.periode{margin-top:22px}
.sem{border-top:1px solid var(--seyes);padding:12px 0}
.sem-num{font-family:"Fraunces",serif;color:var(--marge);font-size:15px;font-weight:700}
.sem ul{margin:8px 0 0;padding-left:18px;font-size:15px;color:var(--encre-clair)}
.sem li{margin:3px 0}
.sem li b{color:var(--encre);font-weight:700}
.reglage{border-top:1px solid var(--seyes);padding:16px 0}
.reglage label{display:block;font-size:14px;color:var(--encre-clair);margin-bottom:6px}
select,.mini{padding:9px 12px;font-size:16px;border:1.5px solid var(--seyes-fort);border-radius:8px;background:var(--craie);color:var(--encre)}
.tableau{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.tableau th,.tableau td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--seyes)}
.tableau th{color:var(--encre-clair);font-weight:400;font-size:13.5px}
.note{font-size:14px;color:var(--encre-clair);margin-top:14px}
.chargement{text-align:center;padding:40px 0;color:var(--encre-clair)}
.point{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--encre);margin:0 3px;animation:respire 1.1s infinite}
.point:nth-child(2){animation-delay:.18s}.point:nth-child(3){animation-delay:.36s}
@keyframes respire{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.point{animation:none;opacity:.6}}
.cache{display:none}
</style>
</head>

/* =========================================================
   2. SAUVEGARDE (dans Claude, sur l'ordinateur, ou rien)
   ========================================================= */
const CLE="cahier6e:simon";
let etat={semaine:1,jour:0,historique:[],modeIA:true};
let modeStockage="aucun";
async function charger(){
  if(typeof window.storage!=="undefined"){
    modeStockage="claude";
    try{const r=await window.storage.get(CLE);if(r&&r.value)Object.assign(etat,JSON.parse(r.value));}catch(e){}
    return;
  }
  try{const v=window.localStorage.getItem(CLE);modeStockage="local";if(v)Object.assign(etat,JSON.parse(v));}
  catch(e){modeStockage="aucun";}
}
async function sauver(){
  try{
    if(modeStockage==="claude"){await window.storage.set(CLE,JSON.stringify(etat));return;}
    if(modeStockage==="local"){window.localStorage.setItem(CLE,JSON.stringify(etat));return;}
  }catch(e){modeStockage="aucun";}
}

/* =========================================================
   3. LA BANQUE D'EXERCICES (fonctionne sans connexion)
   ========================================================= */
const alea=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pioche=t=>t[Math.floor(Math.random()*t.length)];
const vg=x=>String(x).replace(".",",");
function melange(t){const c=t.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function qcm(enonce,bonne,fausses,expl){
  const vus=new Set([String(bonne)]),gardees=[];
  for(const x of fausses){const c=String(x);if(!vus.has(c)){vus.add(c);gardees.push(x);}}
  const choix=melange([bonne,...gardees]);
  return {type:"qcm",enonce,choix,reponse:choix.indexOf(bonne),explication:expl};
}
function saisie(enonce,reponses,expl){return {type:"saisie",enonce,reponse:reponses,explication:expl};}
function qcmChiffres(enonce,bonne,expl){
  const b=Number(bonne),f=[];
  while(f.length<3){const x=alea(0,9);if(x!==b&&!f.includes(x))f.push(x);}
  return qcm(enonce,String(b),f.map(String),expl);
}
function parTag(banque,tag){const f=banque.filter(x=>x.t===tag);const b=pioche(f.length?f:banque);return qcm(b.q,b.b,b.f,b.e);}

/* ---------- MATHÉMATIQUES ---------- */
const GM={
  entiers(){
    const a=alea(10000,999999),b=alea(10000,999999);
    if(a===b)return GM.entiers();
    return qcm("Quel est le plus grand nombre ?",String(Math.max(a,b)),[String(Math.min(a,b))],"On compare le nombre de chiffres, puis chiffre par chiffre en partant de la gauche.");
  },
  addsub(){
    if(alea(0,1)){const a=alea(1200,9800),b=alea(200,1100);return saisie(`Calcule : ${a} + ${b}`,[String(a+b)],`${a} + ${b} = ${a+b}. Pense à aligner les unités.`);}
    const a=alea(3000,9800),b=alea(400,2900);return saisie(`Calcule : ${a} − ${b}`,[String(a-b)],`${a} − ${b} = ${a-b}. Vérifie avec l'addition : ${a-b} + ${b} = ${a}.`);
  },
  decimaux(){
    const t=alea(1,3);
    if(t===1){const n=+(alea(10,99)+alea(1,9)/10).toFixed(1);return qcmChiffres(`Quel est le chiffre des dixièmes dans ${vg(n)} ?`,Math.round(n*10)%10,"Le premier chiffre après la virgule est celui des dixièmes.");}
    if(t===2){const n=+(alea(100,9999)/100).toFixed(2);return saisie(`Arrondis ${vg(n)} à l'unité`,[String(Math.round(n))],`On regarde les dixièmes : 5 ou plus, on arrondit au-dessus. ${vg(n)} → ${Math.round(n)}.`);}
    const a=+(alea(10,99)/10).toFixed(1),b=+(alea(10,99)/100).toFixed(2);
    return qcm(`Quel nombre est le plus grand : ${vg(a)} ou ${vg(b)} ?`,vg(Math.max(a,b)),[vg(Math.min(a,b))],"On compare la partie entière, puis les dixièmes, puis les centièmes. Avoir plus de chiffres ne rend pas un nombre plus grand.");
  },
  mult(){
    if(alea(0,1)){const a=alea(12,99),b=alea(12,99);return saisie(`Calcule : ${a} × ${b}`,[String(a*b)],`${a} × ${b} = ${a*b}. Décompose : ${a} × ${Math.floor(b/10)*10} + ${a} × ${b%10}.`);}
    const a=+(alea(15,995)/10).toFixed(1),m=pioche([10,100,1000]),r=+(a*m).toFixed(2);
    return saisie(`Calcule : ${vg(a)} × ${m}`,[vg(r),String(r)],`Multiplier par ${m}, c'est décaler la virgule de ${String(m).length-1} rang(s) vers la droite : ${vg(r)}.`);
  },
  adddec(){const a=+(alea(15,900)/10).toFixed(1),b=+(alea(15,900)/100).toFixed(2),r=+(a+b).toFixed(2);
    return saisie(`Calcule : ${vg(a)} + ${vg(b)}`,[vg(r),String(r)],`On aligne les virgules : ${vg(a)} + ${vg(b)} = ${vg(r)}.`);},
  multdec(){const a=+(alea(11,99)/10).toFixed(1),b=alea(3,9),r=+(a*b).toFixed(2);
    return saisie(`Calcule : ${vg(a)} × ${b}`,[vg(r),String(r)],`On calcule ${a*10} × ${b} = ${+(a*10*b).toFixed(0)}, puis on divise par 10 : ${vg(r)}.`);},
  division(){const b=alea(3,9),q=alea(11,60),r=alea(0,b-1),a=b*q+r;
    return alea(0,1)?saisie(`Division euclidienne de ${a} par ${b} : quel est le quotient ?`,[String(q)],`${a} = ${b} × ${q} + ${r}.`)
                    :saisie(`Division euclidienne de ${a} par ${b} : quel est le reste ?`,[String(r)],`${a} = ${b} × ${q} + ${r}. Le reste est toujours plus petit que ${b}.`);},
  fractions(){
    const t=alea(1,3);
    if(t===1){const d=pioche([2,3,4,5,10]),n=alea(1,d-1),q=d*alea(2,12);
      return saisie(`Combien font ${n}/${d} de ${q} ?`,[String(q*n/d)],`On divise par ${d} : ${q} ÷ ${d} = ${q/d}, puis on multiplie par ${n} : ${q*n/d}.`);}
    if(t===2){const n=alea(1,9);return qcm(`Quelle fraction est égale à ${vg(n/10)} ?`,`${n}/10`,[`${n}/100`,`10/${n}`,`${n}/2`],`Un chiffre après la virgule, ce sont des dixièmes : ${vg(n/10)} = ${n}/10.`);}
    const d=pioche([4,5,8,10]),a=alea(1,d-1),b=alea(1,d-1);
    return saisie(`Calcule : ${a}/${d} + ${b}/${d}`,[`${a+b}/${d}`],`Même dénominateur : on ajoute les numérateurs, ${a} + ${b} = ${a+b}, donc ${a+b}/${d}.`);
  },
  perimetre(){
    if(alea(0,1)){const L=alea(5,25),l=alea(3,L);return saisie(`Un rectangle mesure ${L} cm sur ${l} cm. Quel est son périmètre en cm ?`,[String(2*(L+l))],`Périmètre = 2 × (${L} + ${l}) = ${2*(L+l)} cm.`);}
    const m=alea(2,9),cm=alea(10,99);return saisie(`Convertis ${m} m ${cm} cm en centimètres`,[String(m*100+cm)],`1 m = 100 cm, donc ${m} m ${cm} cm = ${m*100+cm} cm.`);
  },
  aire(){
    if(alea(0,1)){const L=alea(4,20),l=alea(3,L);return saisie(`Quelle est l'aire d'un rectangle de ${L} cm sur ${l} cm, en cm² ?`,[String(L*l)],`Aire = longueur × largeur = ${L} × ${l} = ${L*l} cm².`);}
    const c=alea(3,15);return saisie(`Quelle est l'aire d'un carré de ${c} cm de côté, en cm² ?`,[String(c*c)],`Aire = côté × côté = ${c} × ${c} = ${c*c} cm².`);
  },
  proportionnalite(){const p=alea(2,9),q=alea(2,12),n=alea(3,9);
    return saisie(`${q} kg de pommes coûtent ${q*p} €. Combien coûtent ${n} kg ?`,[String(n*p),String(n*p)+" €"],`Un kilo coûte ${q*p} ÷ ${q} = ${p} €. Donc ${n} kg coûtent ${n} × ${p} = ${n*p} €.`);},
  pourcentage(){const p=pioche([10,25,50,75]),v=alea(4,25)*4;
    return saisie(`Combien font ${p} % de ${v} ?`,[String(v*p/100),vg(v*p/100)],`${p} % de ${v} = ${v} × ${p} ÷ 100 = ${v*p/100}.`);},
  echelle(){const e=pioche([100,1000,25000]),d=alea(2,9);
    return saisie(`Sur un plan à l'échelle 1/${e}, un segment mesure ${d} cm. Quelle distance réelle cela représente-t-il, en mètres ?`,[String(d*e/100),vg(d*e/100)],`${d} × ${e} = ${d*e} cm en réalité, soit ${d*e/100} m.`);},
  duree(){const h=alea(1,3),mn=alea(10,55),d=alea(20,90);
    const fin=8+h+Math.floor((mn+d)/60),reste=String((mn+d)%60).padStart(2,"0");
    return saisie(`Un film commence à ${8+h} h ${mn} et dure ${d} minutes. À quelle heure se termine-t-il ? (réponds comme 20h15)`,[`${fin}h${reste}`,`${fin} h ${reste}`],`${mn} + ${d} = ${mn+d} minutes, soit ${Math.floor((mn+d)/60)} h ${(mn+d)%60} min à ajouter. Fin à ${fin}h${reste}.`);},
  volume(){
    if(alea(0,1)){const a=alea(2,9),b=alea(2,9),c=alea(2,9);return saisie(`Quel est le volume d'un pavé droit de ${a} cm × ${b} cm × ${c} cm, en cm³ ?`,[String(a*b*c)],`Volume = ${a} × ${b} × ${c} = ${a*b*c} cm³.`);}
    const l=alea(2,20);return saisie(`Combien de centilitres y a-t-il dans ${l} litres ?`,[String(l*100)],`1 L = 100 cL, donc ${l} L = ${l*100} cL.`);},
  stats(){const a=alea(3,12),b=alea(3,12),c=alea(3,12),d=alea(3,12);
    return saisie(`Livres empruntés : lundi ${a}, mardi ${b}, jeudi ${c}, vendredi ${d}. Quel est le total de la semaine ?`,[String(a+b+c+d)],`${a} + ${b} + ${c} + ${d} = ${a+b+c+d} livres.`);},
  algo(){const b=[
      {q:"Dans Scratch, « avancer de 50 pas » puis « tourner de 90° », répété 4 fois, trace :",b:"un carré",f:["un triangle","un cercle","une ligne droite"],e:"Quatre côtés égaux et quatre angles droits."},
      {q:"Dans un algorithme, une boucle sert à :",b:"répéter des instructions",f:["arrêter le programme","changer la couleur","effacer l'écran"],e:"Elle évite d'écrire plusieurs fois la même instruction."},
      {q:"Pour tracer un triangle équilatéral, de combien tourne-t-on à chaque sommet ?",b:"120°",f:["60°","90°","45°"],e:"Un tour complet en 3 fois : 360 ÷ 3 = 120°."},
      {q:"Que signifie « si … alors … » dans un programme ?",b:"une instruction conditionnelle",f:["une boucle","une variable","un commentaire"],e:"L'instruction ne s'exécute que si la condition est vraie."}];

function exoMatiere(mat,sem){
  if(mat==="m")return exoMaths(sem.tm);
  if(mat==="f")return exoFrancais(sem.tf);
  if(mat==="a")return exoAnglais(sem.ta);
  if(mat==="s")return parTag(BANQUE_S,sem.ts);
  return parTag(BANQUE_H,sem.th);
}
function seanceHorsLigne(mat,semaine){
  const sem=SEMAINES[semaine-1];
  if(mat==="rev")return [exoMatiere("m",sem),exoMatiere("f",sem),exoMatiere("a",sem),exoMatiere("s",sem),
                         exoMatiere("h",sem),exoMatiere("m",sem),exoMatiere("f",sem),exoMaths("calcmental")];
  const q=[exoMaths(sem.tm),exoFrancais(sem.tf)];
  for(let i=0;i<4;i++)q.push(exoMatiere(mat,sem));
  return q;
}

function niveauRecent(mat){
  const h=etat.historique.filter(x=>x.mat===mat).slice(-3);
  if(!h.length)return "aucun résultat encore : vise le niveau attendu en sixième";
  const moy=Math.round(h.reduce((s,x)=>s+x.score/x.total,0)/h.length*100);
  if(moy>=85)return `il réussit très bien (${moy} %) : corse un peu les exercices`;
  if(moy>=60)return `il réussit correctement (${moy} %) : garde ce niveau`;
  return `il est en difficulté (${moy} %) : simplifie et explique davantage`;
}
async function seanceIA(semaine,mat){
  const s=SEMAINES[semaine-1];
  const consigne = mat==="rev"
   ? `Tu prépares la séance de révision du week-end d'un élève français de sixième (11 ans), 20 minutes.
Notions de la semaine : maths "${s.m}" ; français "${s.f}" ; anglais "${s.a}" ; sciences "${s.s}" ; histoire-géo et EMC "${s.h}".
Adaptation : ${niveauRecent("rev")}.
Écris 8 questions : 2 de maths, 2 de français, 1 d'anglais, 1 de sciences, 1 d'histoire-géo, puis une dernière question de maths en plusieurs étapes.`
   : `Tu prépares le devoir du soir d'un élève français de sixième (11 ans), 15 minutes.
Notion travaillée cette semaine en ${NOM_MAT[mat]} : "${s[mat]}".
Rituel : 1 question de maths ("${s.m}") et 1 question de français ("${s.f}").
Adaptation : ${niveauRecent(mat)}.
Écris 6 questions : la 1 sur le rituel maths, la 2 sur le rituel français, les 3 à 6 sur la notion de ${NOM_MAT[mat]}, de la plus simple à la plus difficile.`;
  const suite=`
Contraintes : énoncés courts et concrets, vocabulaire de sixième, aucune question portant sur un texte que l'élève n'a pas sous les yeux, explication d'une phrase donnant la méthode.
Réponds UNIQUEMENT avec ce JSON, sans texte autour :
{"questions":[{"type":"qcm","enonce":"...","choix":["...","...","...","..."],"reponse":0,"explication":"..."},{"type":"saisie","enonce":"...","reponse":["réponse acceptée","variante"],"explication":"..."}]}
"reponse" est l'index de la bonne proposition pour un qcm, ou la liste des écritures acceptées pour une saisie. Mélange les deux types.`;
  const rep=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:consigne+suite}]})});
  const data=await rep.json();
  let txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").replace(/```json|```/g,"").trim();
  let obj;
  try{obj=JSON.parse(txt);}catch(e){const c=txt.lastIndexOf("},");obj=JSON.parse(txt.slice(0,c+1)+"]}");}
  const qs=(obj.questions||[]).filter(q=>q&&q.enonce);
  if(qs.length<3)throw new Error("réponse incomplète");
  return qs;
}

function calculSerie(){
  const jours=[...new Set(etat.historique.map(x=>x.date))].sort().reverse();
  if(!jours.length)return 0;
  let n=0,d=new Date();
  for(let i=0;i<400;i++){const iso=d.toISOString().slice(0,10);
    if(jours.includes(iso))n++;else if(n>0||i>0)break;
    d.setDate(d.getDate()-1);}
  return n;
}

  const mat=matiereDuJour(etat.semaine,etat.jour);
  montrer("seance");
  $("#vue-seance").innerHTML=`<div class="chargement"><p>Préparation des exercices…</p><span class="point"></span><span class="point"></span><span class="point"></span></div>`;
  let questions,source="local";
  try{
    if(!etat.modeIA||typeof window.storage==="undefined")throw new Error("hors ligne");
    questions=await seanceIA(etat.semaine,mat);source="ia";
  }catch(e){questions=seanceHorsLigne(mat,etat.semaine);}
  S={questions,i:0,res:[],mat,entrainement,t0:Date.now(),source};
  afficherQuestion();
}
function afficherQuestion(){
  const q=S.questions[S.i];
  const barre=S.questions.map((_,i)=>i<S.res.length?`<i class="${S.res[i]?"ok":"ko"}"></i>`:`<i class="${i===S.i?"en":""}"></i>`).join("");
  const ms=Date.now()-S.t0,min=Math.floor(ms/60000),sec=Math.floor(ms/1000)%60;
  $("#vue-seance").innerHTML=`
    <div class="carte">
      <div class="chrono">Question ${S.i+1} sur ${S.questions.length} · ${min} min ${String(sec).padStart(2,"0")}</div>
      <div class="barre">${barre}</div>
      <p class="enonce">${q.enonce}</p>
      <div id="zone"></div><div id="verdict"></div>
      <button class="cta cache" id="suivant">Question suivante</button>
    </div>`;
  const zone=$("#zone");
  if(q.type==="qcm"){
    zone.className="choix";
    q.choix.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c;
      b.onclick=()=>{[...zone.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel");valider(i);};
      zone.appendChild(b);});
  }else{
    zone.innerHTML=`<input type="text" id="rep" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ta réponse"><button class="cta" id="verif">Vérifier</button>`;
    $("#verif").onclick=()=>valider($("#rep").value);
    $("#rep").addEventListener("keydown",e=>{if(e.key==="Enter")valider($("#rep").value);});
    $("#rep").focus();
  }
}
function normalise(x){return String(x).toLowerCase().trim().replace(/\s+/g," ").replace(",",".").replace(/[.!?]$/,"").replace(/^(l'|le |la |les |un |une |des )/,"");}
function valider(rep){
  const q=S.questions[S.i];let juste;
  if(q.type==="qcm"){
    juste=Number(rep)===Number(q.reponse);
    const btns=[...$("#zone").children];btns.forEach(b=>b.disabled=true);
    btns[Number(q.reponse)].classList.add("bon");
    if(!juste)btns[Number(rep)].classList.add("mauvais");
  }else{
    const acc=Array.isArray(q.reponse)?q.reponse:[q.reponse];
    juste=acc.some(a=>normalise(a)===normalise(rep));
    $("#rep").disabled=true;$("#verif").classList.add("cache");
  }
  S.res.push(juste);
  const bonne=q.type==="qcm"?q.choix[Number(q.reponse)]:(Array.isArray(q.reponse)?q.reponse[0]:q.reponse);
  $("#verdict").innerHTML=`<div class="verdict ${juste?"ok":"ko"}"><b>${juste?"C'est juste.":"La réponse était : "+bonne}</b>${q.explication||""}</div>`;
  const suiv=$("#suivant");suiv.classList.remove("cache");
  suiv.textContent=S.i===S.questions.length-1?"Voir le bilan":"Question suivante";
  suiv.onclick=()=>{S.i++;S.i<S.questions.length?afficherQuestion():bilan();};
  suiv.focus();
}
async function bilan(){
  const score=S.res.filter(Boolean).length,total=S.res.length;
  const duree=Math.max(1,Math.round((Date.now()-S.t0)/60000));
  let mot;
  if(score===total)mot="Sans faute. Tu peux fermer le cahier.";
  else if(score>=total-1)mot="Très bonne séance.";
  else if(score>=total/2)mot="Séance correcte. Relis l'explication de ce qui a coincé.";
  else mot="Séance difficile. Reprends la leçon de la semaine avec un adulte.";
  if(!S.entrainement){
    etat.historique.push({date:new Date().toISOString().slice(0,10),semaine:etat.semaine,jour:etat.jour,mat:S.mat,score,total});
    etat.jour++;
    if(etat.jour>5){etat.jour=0;if(etat.semaine<36)etat.semaine++;}
    await sauver();
  }
  $("#vue-seance").innerHTML=`
    <div class="carte">
      <h2>${score} sur ${total}</h2>
      <p class="notion">${mot}</p>
      <p class="rituel">Terminée en ${duree} min.</p>
      <button class="cta" id="fin">Revenir au cahier</button>
    </div>`;
  $("#fin").onclick=()=>{vueAccueil();montrer("accueil");};
}
function vueProgramme(){
  let html=`<h2>Le programme de l'année</h2>
    <p class="note">36 semaines, six séances par semaine : lundi et jeudi maths, mardi français, mercredi anglais, vendredi sciences (semaines impaires) ou histoire-géo et EMC (semaines paires), et une révision de 20 minutes le week-end. Chaque soir commence par deux questions de rituel en maths et en français.</p>`;
  for(let p=1;p<=5;p++){
    html+=`<div class="periode"><h3>${PERIODES[p-1]}</h3>`;
    SEMAINES.filter(s=>s.p===p).forEach(s=>{
      html+=`<div class="sem"><span class="sem-num">Semaine ${s.n}</span>
        <ul><li><b>Maths</b> — ${s.m}</li><li><b>Français</b> — ${s.f}</li><li><b>Anglais</b> — ${s.a}</li>
        <li><b>Sciences</b> — ${s.s}</li><li><b>Histoire-géo et EMC</b> — ${s.h}</li></ul></div>`;});
    html+=`</div>`;}
  $("#vue-programme").innerHTML=html;
}
function vueParents(){
  const parMat={};
  etat.historique.forEach(x=>{(parMat[x.mat]=parMat[x.mat]||[]).push(x.score/x.total);});
  const lignes=Object.keys(parMat).map(m=>{const t=parMat[m];
    const moy=Math.round(t.reduce((a,b)=>a+b,0)/t.length*100);
    return `<tr><td>${NOM_MAT[m]}</td><td>${t.length}</td><td>${moy} %</td></tr>`;}).join("")
    ||`<tr><td colspan="3">Aucune séance enregistrée pour l'instant.</td></tr>`;
  const dernieres=etat.historique.slice(-8).reverse().map(x=>
    `<tr><td>${x.date.split("-").reverse().join("/")}</td><td>${NOM_MAT[x.mat]}</td><td>${x.score}/${x.total}</td></tr>`).join("")
    ||`<tr><td colspan="3">—</td></tr>`;
  let opts="";for(let i=1;i<=36;i++)opts+=`<option value="${i}" ${i===etat.semaine?"selected":""}>Semaine ${i}</option>`;
  const optsJ=JOURS.map((j,i)=>`<option value="${i}" ${i===etat.jour?"selected":""}>${j.nom}</option>`).join("");
  const msg={claude:"Progression enregistrée dans Claude.",
    local:"Progression enregistrée dans ce navigateur, sur cet ordinateur.",
    aucun:"Ce navigateur n'enregistre pas la progression. Ouvrez le fichier avec Chrome ou Edge."}[modeStockage];
  $("#vue-parents").innerHTML=`
    <h2>Suivi de Simon</h2>
    <p class="note" style="margin-top:4px">Version 4 — septembre 2026</p>
    <table class="tableau"><tr><th>Matière</th><th>Séances</th><th>Réussite</th></tr>${lignes}</table>
    <h3 style="margin-top:26px">Dernières séances</h3>
    <table class="tableau"><tr><th>Date</th><th>Matière</th><th>Score</th></tr>${dernieres}</table>
    <div class="reglage" style="margin-top:26px">
      <label for="sem">Où en est-il ?</label>
      <select id="sem" class="mini">${opts}</select> <select id="jr" class="mini">${optsJ}</select>
      <p class="note">À ajuster si une séance est décalée ou si vous voulez reprendre une semaine.</p>
    </div>
    <div class="reglage">
      <label><input type="checkbox" id="ia" ${etat.modeIA?"checked":""}> Exercices générés à la demande</label>
      <p class="note">Sans effet sur un ordinateur : hors de Claude, l'appli utilise sa banque d'exercices intégrée.</p>
    </div>
    <div class="reglage">
      <button class="cta sec" id="exp" style="margin-top:0">Enregistrer une sauvegarde</button>
      <label for="imp" style="margin-top:14px">Restaurer une sauvegarde</label>
      <input type="file" id="imp" accept="application/json">
      <p class="note">${msg}</p>
    </div>`;
  $("#sem").onchange=async e=>{etat.semaine=Number(e.target.value);await sauver();vueAccueil();};
  $("#jr").onchange=async e=>{etat.jour=Number(e.target.value);await sauver();vueAccueil();};
  $("#ia").onchange=async e=>{etat.modeIA=e.target.checked;await sauver();};
  $("#exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(etat)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="cahier-simon-"+new Date().toISOString().slice(0,10)+".json";a.click();};
  $("#imp").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async()=>{try{Object.assign(etat,JSON.parse(r.result));await sauver();vueParents();vueAccueil();}
      catch(x){alert("Fichier de sauvegarde illisible.");}};
    r.readAsText(f);};
}
(async function(){await charger();vueAccueil();montrer("accueil");})();
</script>
