# Le cahier du soir : devoirs du soir et pêche des enfants.
# Compte Cloudflare bretonvilliers28@gmail.com, comme les autres sites.

name = "cahier-du-soir"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Base à part : les résultats des enfants ne se mélangent à rien d'autre.
# L'identifiant ci-dessous est provisoire (base locale du poste) ; il sera remplacé par
# celui que donne « npx wrangler d1 create cahier-du-soir » à la mise en ligne.
[[d1_databases]]
binding = "DB"
database_name = "cahier-du-soir"
database_id = "00000000-0000-0000-0000-000000000000"
